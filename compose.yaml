services:
  mariadb:
    image: mariadb:12.3
    container_name: trading-platform-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: trading
      MARIADB_USER: trading
      MARIADB_PASSWORD: tradingpassword
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
  nats:
    image: nats:latest
    container_name: trading-platform-nats
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
volumes:      
  mariadb_data:
  nats_data: